<!doctype html>
<html lang="en" class="no-js">
<head>
{% include "head.html" %}
</head>

<body id="page" class="layout-page{% if image.feature %} feature{% endif %}">
{% assign hero = false %}
{% include "navigation.html" %}

<main id="main" class="main">
  <article class="post">
    <header class="post__header">
      <h1 class="post__title">{{ title }}</h1>
    </header>

    {% if image.feature %}
    <figure class="post__image">
      <img src="/images/{{ image.feature }}" alt="{{ image.alt | default: '' }}">
      {% if image.credit %}<figcaption>Image source: <a href="{{ image.creditlink }}">{{ image.credit }}</a></figcaption>{% endif %}
    </figure>
    {% endif %}

    <div class="entry-content">
      {{ content }}
    </div>

    {% if modified %}
    <footer class="post__footer">
      <p class="post-meta">Updated on <time datetime="{{ modified }}">{{ modified | date: "%B %d, %Y" }}</time></p>
    </footer>
    {% endif %}
  </article>
</main>

<footer class="site-footer" role="contentinfo">
  {% include "footer.html" %}
</footer>

{% include "scripts.html" %}

</body>
</html>
