<!doctype html>
<!--[if lt IE 7]><html class="no-js lt-ie9 lt-ie8 lt-ie7" lang="en"> <![endif]-->
<!--[if (IE 7)&!(IEMobile)]><html class="no-js lt-ie9 lt-ie8" lang="en"><![endif]-->
<!--[if (IE 8)&!(IEMobile)]><html class="no-js lt-ie9" lang="en"><![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js" lang="en"><!--<![endif]-->
<head>
{% include "head.html" %}
</head>

<body id="post-index" {% if image.feature %}class="feature"{% endif %}>

{% include "browser-upgrade.html" %}
{% include "navigation.html" %}

<div class="entry-header">
  {% if image.credit %}<div class="image-credit">Image source: <a href="{{ image.creditlink }}">{{ image.credit }}</a></div><!-- /.image-credit -->{% endif %}
  {% if image.feature %}
    <div class="entry-image">
      <img src="/images/{{ image.feature }}" alt="{{ title }}">
    </div><!-- /.entry-image -->
  {% endif %}
  <div class="header-title">
    <div class="header-title-wrap">
      <h1 style="text-align:right;margin-right:45px">{{ site.title }}</h1>
      <h2 style="text-align:right;margin-right:45px;text-transform:none">{{ title }}</h2>
    </div><!-- /.header-title-wrap -->
  </div><!-- /.header-title -->
</div><!-- /.entry-header -->

<div id="main" role="main">
  {{ content }}
</div><!-- /#main -->

<div class="footer-wrapper">
  <footer role="contentinfo">
    {% include "footer.html" %}
  </footer>
</div><!-- /.footer-wrapper -->

{% include "scripts.html" %}

</body>
</html>
