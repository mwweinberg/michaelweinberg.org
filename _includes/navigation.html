<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header{% if hero %} site-header--over-hero{% endif %}">
  <div class="site-header__inner">
    <a class="site-header__name" href="/">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="site-menu">
        <span class="site-nav__bars" aria-hidden="true"></span>Menu
      </button>
      <ul class="site-nav__menu" id="site-menu">
        {% unless page.url == "/" %}<li><a href="/">Home</a></li>{% endunless %}
        <li><a href="/about/">About</a></li>
        <li><a href="/posts/">All Posts</a></li>
        <li><a href="/tags/">Tags</a></li>
        {% for link in navigation %}
        <li><a href="{{ link.url }}"{% if link.url contains 'http' %} target="_blank" rel="noopener"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
<script>
  // Menu button for narrow screens: shows / hides the list of links. No animation.
  (function () {
    var btn = document.querySelector(".site-nav__toggle"), menu = document.getElementById("site-menu");
    if (!btn || !menu) return;
    function set(open) { btn.setAttribute("aria-expanded", open ? "true" : "false"); menu.classList.toggle("is-open", open); }
    btn.addEventListener("click", function () { set(btn.getAttribute("aria-expanded") !== "true"); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && menu.classList.contains("is-open")) { set(false); btn.focus(); } });
    document.addEventListener("click", function (e) { if (!e.target.closest(".site-nav")) set(false); });
  })();
</script>
